<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32pt;">
    <div style="display: flex; align-items: center; gap: 12pt;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 1</p>
      <h2 style="font-size: 24pt; font-weight: 600; color: #2d2a26;">코딩은 어디로 가고 있는가</h2>
    </div>
    <p style="font-size: 10pt; color: #6b6560;">03</p>
  </div>

  <!-- 콘텐츠 영역 -->
  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24pt;">
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 24pt;">
      <p style="font-size: 28pt; font-weight: 700; color: #2d2a26; margin-bottom: 12pt;">추상화의 역사</p>
      <p style="font-size: 12pt; color: #6b6560; line-height: 1.7;">
        어셈블리 → 고급언어 → 프레임워크 → 자연어. 코딩의 진입장벽은 계속 낮아지고 있다.
      </p>
    </div>
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 24pt;">
      <p style="font-size: 28pt; font-weight: 700; color: #2d2a26; margin-bottom: 12pt;">문서 = 개발</p>
      <p style="font-size: 12pt; color: #6b6560; line-height: 1.7;">
        문서를 작성하는 것이 곧 개발이 되는 시대. 명확한 스펙이 실행 가능한 코드가 된다.
      </p>
    </div>
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 24pt;">
      <p style="font-size: 28pt; font-weight: 700; color: #2d2a26; margin-bottom: 12pt;">역할 변화</p>
      <p style="font-size: 12pt; color: #6b6560; line-height: 1.7;">
        코드 작성자에서 의도 설계자 & 문서 엔지니어로. 개발자의 핵심 역량이 달라진다.
      </p>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 16pt; border-top: 1px solid #ddd8d0;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">2026.04.07</p>
  </div>
</body>
</html>
