<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 48pt;
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 48pt;
    }
  </style>
</head>
<body>
  <!-- 왼쪽: 타이틀 -->
  <div style="display: flex; flex-direction: column; justify-content: flex-end;">
    <p style="font-size: 9pt; color: #6b6560; margin-bottom: 16pt;">CLAUDE CODE SEMINAR</p>
    <h1 style="font-size: 48pt; font-weight: 500; color: #2d2a26; letter-spacing: -0.02em; line-height: 1.1;">
      목차
    </h1>
    <div style="width: 32pt; height: 3pt; background: #c45a3b; margin-top: 16pt; border-radius: 2pt;"></div>
  </div>

  <!-- 오른쪽: 목차 리스트 -->
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 12pt;">
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0; border-bottom: 1px solid rgba(0,0,0,0.08);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">01</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">코딩은 어디로 가고 있는가</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0; border-bottom: 1px solid rgba(0,0,0,0.08);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">02</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">왜 Claude Code인가</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0; border-bottom: 1px solid rgba(0,0,0,0.08);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">03</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">기본 사용법</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0; border-bottom: 1px solid rgba(0,0,0,0.08);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">04</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">AI 시대의 개발 방법론</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0; border-bottom: 1px solid rgba(0,0,0,0.08);">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">05</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">하네스 & 컨텍스트 엔지니어링</p>
    </div>
    <div style="display: flex; align-items: center; gap: 16pt; padding: 10pt 0;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">06–11</p>
      <p style="flex: 1; font-size: 13pt; font-weight: 500; color: #2d2a26;">실패 패턴 · 멀티에이전트 · 실전 · 비개발자 · 마무리</p>
    </div>
  </div>
</body>
</html>
