<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 32pt 48pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 16pt;">
      <div style="display: flex; align-items: center; gap: 8pt;">
        <div style="width: 18pt; height: 18pt; background: #c45a3b; border-radius: 3pt; display: flex; align-items: center; justify-content: center;">
          <p style="color: #fff; font-size: 10pt;">✦</p>
        </div>
        <p style="font-size: 11pt; font-weight: 600; color: #2d2a26;">Claude Code</p>
      </div>
      <p style="display: inline-block; padding: 4pt 10pt; border: 1px solid #c45a3b; border-radius: 12pt; font-size: 9pt; font-weight: 500; color: #c45a3b;">전사 세미나</p>
    </div>
    <div style="display: flex; align-items: center; gap: 8pt;">
      <p style="display: inline-block; padding: 4pt 10pt; border: 1px solid #ddd8d0; border-radius: 12pt; font-size: 9pt; font-weight: 500; color: #6b6560;">2026.04.07</p>
    </div>
  </div>

  <!-- 메인 타이틀 -->
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
    <h1 style="font-size: 60pt; font-weight: 500; color: #2d2a26; letter-spacing: -0.02em; line-height: 1.15;">
      클로드코드<br>잘 사용하기
    </h1>
    <p style="font-size: 14pt; color: #6b6560; margin-top: 24pt;">
      AI와 함께하는 새로운 개발 워크플로우
    </p>
    <div style="width: 40pt; height: 3pt; background: #c45a3b; margin-top: 16pt; border-radius: 2pt;"></div>
  </div>

  <!-- 푸터 정보 -->
  <div style="display: flex; gap: 64pt;">
    <div>
      <p style="font-size: 9pt; color: #6b6560; margin-bottom: 4pt;">발표자</p>
      <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">Young Dong</p>
    </div>
    <div>
      <p style="font-size: 9pt; color: #6b6560; margin-bottom: 4pt;">일시</p>
      <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">2026년 4월 7일</p>
    </div>
    <div>
      <p style="font-size: 9pt; color: #6b6560; margin-bottom: 4pt;">소요시간</p>
      <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">약 60분</p>
    </div>
  </div>
</body>
</html>
