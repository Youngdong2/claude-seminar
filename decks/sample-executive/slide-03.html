<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #ffffff;
      padding: 56pt 64pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- 섹션 라벨 + 타이틀 -->
  <p style="font-size: 11pt; font-weight: 500; color: #86868b; letter-spacing: 0.02em; margin-bottom: 8pt;">SECTION 1</p>
  <h2 style="font-size: 36pt; font-weight: 700; color: #1d1d1f; letter-spacing: -0.02em; margin-bottom: 48pt;">코딩은 어디로 가고 있는가</h2>

  <!-- 3컬럼 카드 -->
  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20pt;">
    <div style="background: #f5f5f7; border-radius: 12pt; padding: 28pt 24pt;">
      <p style="font-size: 15pt; font-weight: 700; color: #1d1d1f; margin-bottom: 14pt; line-height: 1.3;">추상화의<br>역사</p>
      <p style="font-size: 11pt; color: #86868b; line-height: 1.7;">
        어셈블리 → 고급언어 → 프레임워크 → 자연어. 코딩의 진입장벽은 계속 낮아지고 있다.
      </p>
    </div>
    <div style="background: #f5f5f7; border-radius: 12pt; padding: 28pt 24pt;">
      <p style="font-size: 15pt; font-weight: 700; color: #1d1d1f; margin-bottom: 14pt; line-height: 1.3;">문서가 곧<br>개발이다</p>
      <p style="font-size: 11pt; color: #86868b; line-height: 1.7;">
        문서를 작성하는 것이 곧 개발이 되는 시대. 명확한 스펙이 실행 가능한 코드가 된다.
      </p>
    </div>
    <div style="background: #f5f5f7; border-radius: 12pt; padding: 28pt 24pt;">
      <p style="font-size: 15pt; font-weight: 700; color: #1d1d1f; margin-bottom: 14pt; line-height: 1.3;">개발자의<br>역할 변화</p>
      <p style="font-size: 11pt; color: #86868b; line-height: 1.7;">
        코드 작성자에서 의도 설계자 & 문서 엔지니어로. 핵심 역량이 달라진다.
      </p>
    </div>
  </div>
</body>
</html>
