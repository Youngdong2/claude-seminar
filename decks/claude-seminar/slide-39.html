<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 20pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 4</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">왜 프롬프트만으로는 부족한가</h2>
  </div>

  <!-- 신뢰성의 수학 -->
  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20pt;">
    <div style="display: flex; flex-direction: column; gap: 14pt;">
      <div style="background: #f0ebe3; border-radius: 8pt; padding: 16pt 20pt;">
        <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 6pt;">재현성 문제</p>
        <p style="font-size: 11pt; color: #2d2a26; line-height: 1.5;">같은 프롬프트에도 다른 결과<br>AI는 <strong>비결정적</strong> 시스템</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 8pt; padding: 16pt 20pt;">
        <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 6pt;">하네스 = 품질 안정화</p>
        <p style="font-size: 11pt; color: #2d2a26; line-height: 1.5;">동일 모델, 하네스 품질에 따라<br>작업 완료율 <strong>60% vs 98%</strong></p>
      </div>
      <p style="font-size: 9pt; color: #6b6560; font-style: italic;">Manus: 6개월간 하네스 5번 완전 재작성<br>Vercel: 도구 80% 제거 → 더 나은 결과</p>
    </div>

    <div style="background: #2d2a26; border-radius: 10pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
      <p style="font-size: 10pt; color: #6b6560; margin-bottom: 12pt;">신뢰성의 수학</p>
      <p style="font-size: 14pt; color: #faf8f5; margin-bottom: 6pt;">각 단계 성공률 <span style="color: #c45a3b; font-weight: 700;">95%</span></p>
      <p style="font-size: 14pt; color: #faf8f5; margin-bottom: 16pt;">20단계 체인이라면?</p>
      <p style="font-size: 48pt; font-weight: 700; color: #c45a3b; margin-bottom: 8pt;">36%</p>
      <p style="font-size: 11pt; color: #6b6560;">0.95²⁰ = 0.358</p>
      <p style="font-size: 10pt; color: #faf8f5; margin-top: 16pt; line-height: 1.5;">"95% 동작하는" 에이전트가<br>실제 작업의 2/3에서 실패</p>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">39</p>
  </div>
</body>
</html>
