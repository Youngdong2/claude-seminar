<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 20pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 4</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">"모델이 사용하는 코드"를 만드는 것</h2>
  </div>

  <div style="background: #2d2a26; border-radius: 10pt; padding: 24pt 32pt; margin-bottom: 20pt;">
    <p style="font-size: 13pt; color: #faf8f5; line-height: 1.6; font-style: italic;">"나는 모델을 사용하는 코드를 만드는 것이 아니었다.<br><span style="color: #c45a3b; font-weight: 600;">모델이 사용하는 코드</span>를 만들고 있었다."</p>
    <p style="font-size: 9pt; color: #6b6560; margin-top: 10pt; text-align: right;">— Ari Mendelow, Ouroboros</p>
  </div>

  <p style="font-size: 11pt; color: #6b6560; margin-bottom: 16pt;">이 관점 전환이 설계 제약을 뒤집는다:</p>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14pt;">
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 18pt;">
      <p style="font-size: 13pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">파일 구조</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">모델이 탐색해야 하니까<br>구조가 중요하다</p>
    </div>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 18pt;">
      <p style="font-size: 13pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">네이밍</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">모델이 이름으로<br>목적을 파악하니까</p>
    </div>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 18pt;">
      <p style="font-size: 13pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">문서화</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">문서가 곧 모델의<br>자기인식이니까</p>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">46</p>
  </div>
</body>
</html>
