<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 8</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">개발자만의 이야기가 아닌 이유</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 14pt;">이 발표에서 다룬 핵심 원칙 — 전부 <strong style="color: #2d2a26;">도구를 다루는 보편 원리</strong>.</p>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10pt; margin-bottom: 14pt;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">원하는 것을 글로 먼저</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">컨텍스트 설계</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">규칙을 문서로 고정</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">계획 · 실행 · 검증 분리</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">암묵지를 파일로</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; font-weight: 600;">잘 만든 도구 활용</p>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 14pt 22pt;">
    <p style="font-size: 11pt; color: #faf8f5; line-height: 1.45;">이 중 <strong style="color: #c45a3b;">"개발자에게만"</strong> 해당 — 하나도 없음.</p>
    <p style="font-size: 9.5pt; color: #6b6560; margin-top: 4pt;">예시가 마침 코드일 뿐.</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">79</p>
  </div>
</body>
</html>
