<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 3</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">구조화 수준 스펙트럼</h2>
  </div>

  <!-- 스펙트럼 축 -->
  <div style="display: flex; align-items: center; gap: 0; margin-bottom: 6pt; padding: 0 4pt;">
    <p style="font-size: 10pt; font-weight: 600; color: #6b6560;">자유</p>
    <div style="flex: 1; height: 2pt; background: linear-gradient(to right, #ddd8d0, #c45a3b); margin: 0 12pt; border-radius: 1pt;"></div>
    <p style="font-size: 10pt; font-weight: 600; color: #c45a3b;">엄격</p>
  </div>

  <div style="display: flex; gap: 24pt;">
    <div style="flex: 1; background: #f0ebe3; border-radius: 6pt; padding: 28pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <p style="font-size: 22pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">TDD</p>
      <p style="font-size: 12pt; color: #6b6560;">테스트 주도</p>
      <div style="width: 40pt; height: 2pt; background: #ddd8d0; margin: 16pt 0;"></div>
      <p style="font-size: 13pt; font-weight: 600; color: #c45a3b;">검증</p>
    </div>
    <div style="flex: 1; background: #2d2a26; border-radius: 8pt; padding: 28pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <p style="font-size: 22pt; font-weight: 700; color: #faf8f5; margin-bottom: 8pt;">SDD</p>
      <p style="font-size: 12pt; color: #a09a94;">스펙 주도</p>
      <div style="width: 40pt; height: 2pt; background: #4a4540; margin: 16pt 0;"></div>
      <p style="font-size: 13pt; font-weight: 600; color: #c45a3b;">계획</p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">28</p>
  </div>
</body>
</html>
