<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 3</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">왜 방법론이 필요한가</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 24pt;">에이전틱 코딩 등장 → 병목의 이동.</p>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24pt; align-items: center;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 24pt; text-align: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #6b6560; margin-bottom: 12pt;">이전의 병목</p>
      <p style="font-size: 18pt; font-weight: 600; color: #2d2a26;">코드를 작성하는 것</p>
    </div>
    <div style="background: #2d2a26; border-radius: 8pt; padding: 24pt; text-align: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 12pt;">지금의 병목</p>
      <p style="font-size: 16pt; font-weight: 600; color: #faf8f5; line-height: 1.5;">AI에게 <strong style="color: #c45a3b;">무엇을</strong> 시킬지 정하는 것<br>+ 정말 원하는 대로 했는지 <strong style="color: #c45a3b;">확인</strong>하는 것</p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">28</p>
  </div>
</body>
</html>
