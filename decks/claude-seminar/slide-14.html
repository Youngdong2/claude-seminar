<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 28pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">AI 코딩 도구의 진화 3단계</h2>
  </div>

  <!-- 3단계 카드 -->
  <div style="flex: 1; display: flex; gap: 16pt;">
    <div style="flex: 1; background: #f0ebe3; border-radius: 8pt; padding: 20pt; display: flex; flex-direction: column;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 8pt;">1단계</p>
      <p style="font-size: 16pt; font-weight: 600; color: #2d2a26; margin-bottom: 10pt;">자동완성</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.6;">IDE가 다음 줄을 예측<br>반복 패턴에 탁월</p>
      <div style="margin-top: auto; padding-top: 12pt; border-top: 1px solid #ddd8d0;">
        <p style="font-size: 9pt; color: #6b6560;">한계: 현재 파일로 컨텍스트 제한</p>
      </div>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-radius: 8pt; padding: 20pt; display: flex; flex-direction: column;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 8pt;">2단계</p>
      <p style="font-size: 16pt; font-weight: 600; color: #2d2a26; margin-bottom: 10pt;">대화형 채팅</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.6;">코드 토론, 버그 설명<br>스니펫 붙여넣기</p>
      <div style="margin-top: auto; padding-top: 12pt; border-top: 1px solid #ddd8d0;">
        <p style="font-size: 9pt; color: #6b6560;">한계: 다중 파일 조율이 수동</p>
      </div>
    </div>
    <div style="flex: 1; background: #2d2a26; border-radius: 8pt; padding: 20pt; display: flex; flex-direction: column;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 8pt;">3단계</p>
      <p style="font-size: 16pt; font-weight: 600; color: #faf8f5; margin-bottom: 10pt;">에이전틱 코딩</p>
      <p style="font-size: 10pt; color: #a09a94; line-height: 1.6;">목표를 분해하고 독립 실행<br>전체 코드베이스 이해</p>
      <div style="margin-top: auto; padding-top: 12pt; border-top: 1px solid #4a4640;">
        <p style="font-size: 9pt; font-weight: 600; color: #c45a3b;">← 지금 여기</p>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">14</p>
  </div>
</body>
</html>
