<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt;">그런데 이걸 매번 수동으로 할 것인가?</p>

  <div style="display: flex; flex-direction: column; gap: 10pt; margin-bottom: 28pt; width: 100%;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 24pt; text-align: left;">
      <p style="font-size: 12pt; color: #2d2a26;">→ <strong>스펙 템플릿</strong>을 계획 문서로 정착시키고</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 24pt; text-align: left;">
      <p style="font-size: 12pt; color: #2d2a26;">→ Skills로 <strong>TDD 워크플로우</strong>를 패키징하고</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 24pt; text-align: left;">
      <p style="font-size: 12pt; color: #2d2a26;">→ Hooks로 <strong>테스트 자동 실행</strong>을 걸면</p>
    </div>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 24pt 48pt;">
    <p style="font-size: 22pt; font-weight: 600; color: #faf8f5;">이 시스템이 곧 <span style="color: #c45a3b;">하네스 엔지니어링</span></p>
  </div>
</body>
</html>
