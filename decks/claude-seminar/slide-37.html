<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 4</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">엔지니어링의 진화</h2>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16pt; align-items: center;">
    <!-- 프롬프트 엔지니어링 -->
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 18pt 20pt; display: flex; flex-direction: column; gap: 8pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560; letter-spacing: 0.04em;">2023–</p>
      <p style="font-size: 15pt; font-weight: 700; color: #2d2a26; line-height: 1.3;">프롬프트<br>엔지니어링</p>
      <p style="font-size: 11pt; color: #6b6560; line-height: 1.5;">모델에<br>무엇을 <span style="color: #c45a3b; font-weight: 700; font-size: 14pt;">말할</span> 것인가</p>
      <div style="padding-top: 10pt; margin-top: 2pt; border-top: 1pt solid #ddd;">
        <p style="font-size: 9pt; color: #6b6560;">단일 프롬프트 · 정적</p>
      </div>
    </div>
    <!-- 컨텍스트 엔지니어링 -->
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 18pt 20pt; display: flex; flex-direction: column; gap: 8pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560; letter-spacing: 0.04em;">2025–</p>
      <p style="font-size: 15pt; font-weight: 700; color: #2d2a26; line-height: 1.3;">컨텍스트<br>엔지니어링</p>
      <p style="font-size: 11pt; color: #6b6560; line-height: 1.5;">모델에<br>무엇을 <span style="color: #c45a3b; font-weight: 700; font-size: 14pt;">보여줄</span> 것인가</p>
      <div style="padding-top: 10pt; margin-top: 2pt; border-top: 1pt solid #ddd;">
        <p style="font-size: 9pt; color: #6b6560;">입력 파이프라인 전체 · 동적</p>
      </div>
    </div>
    <!-- 하네스 엔지니어링 -->
    <div style="background: #2d2a26; border-radius: 8pt; padding: 18pt 20pt; display: flex; flex-direction: column; gap: 8pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.04em;">2026–</p>
      <p style="font-size: 15pt; font-weight: 700; color: #faf8f5; line-height: 1.3;">하네스<br>엔지니어링</p>
      <p style="font-size: 11pt; color: #a09a94; line-height: 1.5;">모델 주변에<br>무엇을 <span style="color: #c45a3b; font-weight: 700; font-size: 14pt;">구축할</span> 것인가</p>
      <div style="padding-top: 10pt; margin-top: 2pt; border-top: 1pt solid #555;">
        <p style="font-size: 9pt; color: #6b6560;">실행 환경 전체 · 시스템 아키텍처</p>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">37</p>
  </div>
</body>
</html>
