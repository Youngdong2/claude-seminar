<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt;">결론</p>

  <p style="font-size: 32pt; font-weight: 700; color: #2d2a26; margin-bottom: 28pt;">Spec + TDD</p>

  <div style="display: grid; grid-template-columns: 1fr 40pt 1fr; gap: 0; align-items: center; margin-bottom: 28pt;">
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 20pt;">
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; margin-bottom: 6pt;">Spec</p>
      <p style="font-size: 11pt; color: #6b6560;">"무엇을" 정의<br>의도 명확화</p>
    </div>
    <p style="font-size: 20pt; color: #c45a3b; text-align: center;">+</p>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 20pt;">
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; margin-bottom: 6pt;">TDD</p>
      <p style="font-size: 11pt; color: #6b6560;">"정말 그렇게 됐는지" 검증<br>결과를 자동으로 확인</p>
    </div>
  </div>

  <p style="font-size: 13pt; color: #6b6560; line-height: 1.6;">스펙 없는 TDD — 나무는 보되 숲은 놓침<br>TDD 없는 스펙 — 검증 수단 부재</p>
</body>
</html>
