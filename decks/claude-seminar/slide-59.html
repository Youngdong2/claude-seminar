<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 5</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">신뢰성의 수학 — 복리로 쌓이는 실패</h2>
  </div>

  <p style="font-size: 11pt; color: #6b6560; margin-bottom: 14pt;">각 단계 성공률 <strong style="color: #2d2a26;">95%</strong> 가정 → 다단계 작업의 전체 성공률?</p>

  <div style="flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 20pt;">
    <!-- Table -->
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 16pt 20pt;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8pt 16pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #6b6560; border-bottom: 1pt solid rgba(0,0,0,0.12); padding-bottom: 4pt;">단계 수</p>
        <p style="font-size: 9pt; font-weight: 700; color: #6b6560; border-bottom: 1pt solid rgba(0,0,0,0.12); padding-bottom: 4pt; text-align: right;">전체 성공률</p>

        <p style="font-size: 11pt; color: #2d2a26;">1 단계</p>
        <p style="font-size: 11pt; color: #2d2a26; text-align: right; font-family: monospace;">95%</p>

        <p style="font-size: 11pt; color: #2d2a26;">5 단계</p>
        <p style="font-size: 11pt; color: #2d2a26; text-align: right; font-family: monospace;">77%</p>

        <p style="font-size: 11pt; color: #2d2a26;">10 단계</p>
        <p style="font-size: 11pt; color: #2d2a26; text-align: right; font-family: monospace;">60%</p>

        <p style="font-size: 13pt; color: #c45a3b; font-weight: 700;">20 단계</p>
        <p style="font-size: 13pt; color: #c45a3b; text-align: right; font-family: monospace; font-weight: 700;">36%</p>

        <p style="font-size: 13pt; color: #c45a3b; font-weight: 700;">50 단계</p>
        <p style="font-size: 13pt; color: #c45a3b; text-align: right; font-family: monospace; font-weight: 700;">8%</p>
      </div>
    </div>

    <!-- Insights -->
    <div style="display: flex; flex-direction: column; gap: 10pt;">
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 10pt 14pt;">
        <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.5;">계획 → 탐색 → 작성 → 테스트 → 수정 → 커밋 — 20단계만 가도 <strong>2/3이 실패</strong></p>
      </div>
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 10pt 14pt;">
        <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.5;">에이전트를 만드는 건 쉬운 부분 — 프로덕션 신뢰성이 진짜 엔지니어링</p>
      </div>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 12pt 16pt; flex: 1; display: flex; align-items: center;">
        <p style="font-size: 10pt; color: #faf8f5; line-height: 1.5;">검증 루프 · 재시도 · 체크포인트 — 복합 실패율을 낮추는 건 <strong style="color: #c45a3b;">하네스</strong>뿐</p>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">59</p>
  </div>
</body>
</html>
