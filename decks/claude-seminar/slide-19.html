<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">에이전트 루프</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 20pt;">목표만 주면 작업 완료까지 알아서 반복. 언제든 중단하여 방향 수정 가능.</p>

  <!-- 순환 다이어그램 -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 20pt;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 20pt; text-align: center; width: 170pt;">
      <p style="font-size: 28pt; margin-bottom: 8pt;">1</p>
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; margin-bottom: 6pt;">컨텍스트 수집</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">파일 검색, 코드 구조 파악<br>설정 파일 읽기, 의존성 매핑</p>
    </div>
    <p style="font-size: 24pt; color: #c45a3b;">→</p>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 20pt; text-align: center; width: 170pt;">
      <p style="font-size: 28pt; margin-bottom: 8pt;">2</p>
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; margin-bottom: 6pt;">작업 수행</p>
      <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">파일 편집, 셸 명령 실행<br>새 파일 생성</p>
    </div>
    <p style="font-size: 24pt; color: #c45a3b;">→</p>
    <div style="background: #2d2a26; border-radius: 8pt; padding: 20pt; text-align: center; width: 170pt;">
      <p style="font-size: 28pt; color: #c45a3b; margin-bottom: 8pt;">3</p>
      <p style="font-size: 14pt; font-weight: 600; color: #faf8f5; margin-bottom: 6pt;">결과 검증</p>
      <p style="font-size: 10pt; color: #a09a94; line-height: 1.5;">테스트 실행, 빌드 확인<br>오류 시 1로 복귀</p>
    </div>
  </div>
  <!-- 복귀 화살표 -->
  <svg viewBox="0 0 624 44" style="width: 624pt; height: 44pt; margin-top: 4pt;">
    <defs>
      <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
        <polygon points="0 0, 6 2.5, 0 5" fill="#c45a3b"/>
      </marker>
    </defs>
    <path d="M 520 6 C 520 22, 104 22, 104 6" fill="none" stroke="#c45a3b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="312" y="38" text-anchor="middle" font-size="9" fill="#6b6560" font-family="Pretendard, sans-serif">목표 달성까지 반복</text>
  </svg>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">19</p>
  </div>
</body>
</html>
