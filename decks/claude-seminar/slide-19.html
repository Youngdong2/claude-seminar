<!DOCTYPE html>
<html>
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>

      <p style="font-size: 12pt; font-weight: 600; color: #2d2a26;">JetBrains</p>
      <p style="font-size: 9pt; color: #6b6560; margin-top: 4pt;">확장 프로그램</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 16pt 20pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">

    <div style="background: #f0ebe3; border-radius: 6pt; padding: 16pt 20pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
