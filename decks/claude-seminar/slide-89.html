<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 16pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 9</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">내일부터</h2>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10pt; margin-bottom: 14pt;">
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 14pt 20pt;">
      <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 4pt;">개발자</p>
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26;">프로젝트에 CLAUDE.md 1페이지 작성</p>
    </div>

    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 14pt 20pt;">
      <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 4pt;">비개발자</p>
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26;">반복 업무 1개를 글로 명세</p>
    </div>

    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 14pt 20pt;">
      <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 4pt;">공통</p>
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26;">터미널 열고 Claude Code 3~4창 — 토큰을 일부러라도 소비</p>
    </div>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 12pt 20pt;">
    <p style="font-size: 10.5pt; color: #faf8f5; line-height: 1.5;">안 쓰는 것보다 써보는 게 발전. <em>"토큰을 많이 쓰는 사람이 가장 경쟁력 있는 개발자"</em> <span style="color: #a09a94;">— 박종천</span></p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">89</p>
  </div>
</body>
</html>
