<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 6</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">Agent Teams — 양방향 대화가 가능한 팀</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 14pt;">Sub-Agent가 "시켜놓고 받는" 구조라면, Teams는 <strong style="color: #2d2a26;">같이 토론하고 합의</strong>하는 구조.</p>

  <div style="display: grid; grid-template-columns: 1.1fr 1fr; gap: 14pt;">
    <!-- Left: diagram of dynamic team -->
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 14pt 16pt; display: flex; flex-direction: column;">
      <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 6pt;">동적 팀 구성 예 — 경쟁사 분석</p>
      <svg viewBox="0 0 340 180" style="width: 100%; flex: 1;">
        <!-- Central orchestrator -->
        <rect x="135" y="75" width="70" height="30" rx="4" fill="#2d2a26"/>
        <text x="170" y="88" text-anchor="middle" font-family="Pretendard" font-size="9" font-weight="700" fill="#faf8f5">Consultant</text>
        <text x="170" y="99" text-anchor="middle" font-family="Pretendard" font-size="7" fill="#c45a3b">분석 프레임</text>

        <!-- Researchers (top, parallel) -->
        <rect x="20" y="15" width="62" height="28" rx="4" fill="#faf8f5" stroke="#c45a3b" stroke-width="1.3"/>
        <text x="51" y="27" text-anchor="middle" font-family="Pretendard" font-size="8" font-weight="700" fill="#2d2a26">Researcher</text>
        <text x="51" y="38" text-anchor="middle" font-family="Pretendard" font-size="6.5" fill="#6b6560">시장</text>

        <rect x="139" y="15" width="62" height="28" rx="4" fill="#faf8f5" stroke="#c45a3b" stroke-width="1.3"/>
        <text x="170" y="27" text-anchor="middle" font-family="Pretendard" font-size="8" font-weight="700" fill="#2d2a26">Researcher</text>
        <text x="170" y="38" text-anchor="middle" font-family="Pretendard" font-size="6.5" fill="#6b6560">제품</text>

        <rect x="258" y="15" width="62" height="28" rx="4" fill="#faf8f5" stroke="#c45a3b" stroke-width="1.3"/>
        <text x="289" y="27" text-anchor="middle" font-family="Pretendard" font-size="8" font-weight="700" fill="#2d2a26">Researcher</text>
        <text x="289" y="38" text-anchor="middle" font-family="Pretendard" font-size="6.5" fill="#6b6560">가격</text>

        <!-- Lines from researchers to consultant (bidirectional hint) -->
        <line x1="51" y1="43" x2="140" y2="77" stroke="#6b6560" stroke-width="1"/>
        <line x1="170" y1="43" x2="170" y2="75" stroke="#6b6560" stroke-width="1"/>
        <line x1="289" y1="43" x2="200" y2="77" stroke="#6b6560" stroke-width="1"/>

        <!-- Editor (bottom) -->
        <rect x="135" y="140" width="70" height="28" rx="4" fill="#faf8f5" stroke="#c45a3b" stroke-width="1.3"/>
        <text x="170" y="152" text-anchor="middle" font-family="Pretendard" font-size="8" font-weight="700" fill="#2d2a26">Editor</text>
        <text x="170" y="163" text-anchor="middle" font-family="Pretendard" font-size="6.5" fill="#6b6560">최종 리포트</text>

        <!-- Bidirectional arrow consultant ↔ editor -->
        <line x1="170" y1="105" x2="170" y2="138" stroke="#c45a3b" stroke-width="1.4"/>
        <polygon points="170,106 166,114 174,114" fill="#c45a3b"/>
        <polygon points="170,138 166,130 174,130" fill="#c45a3b"/>

        <!-- Labels -->
        <text x="90" y="65" font-family="Pretendard" font-size="6" fill="#c45a3b" font-weight="600">병렬 탐색</text>
        <text x="180" y="125" font-family="Pretendard" font-size="6" fill="#c45a3b" font-weight="600">양방향</text>
      </svg>
    </div>

    <!-- Right: key characteristics -->
    <div style="display: flex; flex-direction: column; gap: 10pt; justify-content: center;">
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
        <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">자동 수정 루프</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.5;">Worker 구현 → QA 검증 → Support 수정 → QA 재검증</p>
      </div>
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
        <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">공유 컨텍스트 뱅크</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.5;">프로젝트 스펙·제약은 중앙에 두고 참조</p>
      </div>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 10pt 18pt; margin-top: 12pt;">
    <p style="font-size: 10pt; color: #faf8f5; line-height: 1.4;">3명까지는 이득 · 10명 넘으면 대기 시간 > 작업 시간 — <span style="color: #c45a3b; font-weight: 700;">"팀이면 다 좋다"는 환상 경계</span>.</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">67</p>
  </div>
</body>
</html>
