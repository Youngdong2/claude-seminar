<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 10pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 6</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">5분 에이전트 철학</h2>
  </div>

  <p style="font-size: 11pt; color: #6b6560; margin-bottom: 14pt;">긴 에이전트 하나보다 <strong style="color: #2d2a26;">짧은 에이전트 여럿</strong></p>

  <div style="display: flex; flex-direction: column; gap: 12pt;">
    <!-- Comparison: long vs many short -->
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 14pt 18pt;">
      <svg viewBox="0 0 600 80" style="width: 100%; height: 70pt;">
        <!-- Top: long single chain -->
        <text x="8" y="18" font-family="Pretendard" font-size="10" font-weight="700" fill="#6b6560">Before</text>
        <rect x="70" y="8" width="510" height="18" rx="3" fill="#6b6560" opacity="0.35"/>
        <text x="325" y="21" text-anchor="middle" font-family="Pretendard" font-size="9" font-weight="600" fill="#2d2a26">2시간짜리 에이전트 하나 — 실패하면 2시간 날아감</text>

        <!-- Bottom: many short -->
        <text x="8" y="58" font-family="Pretendard" font-size="10" font-weight="700" fill="#c45a3b">After</text>
        <g>
          <rect x="70" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="117" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="164" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="211" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="258" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="305" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="352" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="399" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="446" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="493" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
          <rect x="540" y="48" width="40" height="18" rx="3" fill="#c45a3b" opacity="0.85"/>
        </g>
        <text x="90" y="78" text-anchor="middle" font-family="Pretendard" font-size="7" fill="#6b6560">5분</text>
        <text x="560" y="78" text-anchor="middle" font-family="Pretendard" font-size="7" fill="#6b6560">5분</text>
      </svg>
    </div>

    <!-- Why shorter wins -->
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10pt;">
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 12pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">실패 지점이 짧다</p>
        <p style="font-size: 8pt; color: #2d2a26; line-height: 1.45;">5분 실패 = 5분 손해</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 12pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">컨텍스트 신선</p>
        <p style="font-size: 8pt; color: #2d2a26; line-height: 1.45;">50k 넘기 전에 끝남</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 12pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">재시도 가능</p>
        <p style="font-size: 8pt; color: #2d2a26; line-height: 1.45;">멱등성 설계 쉬움</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 12pt;">
        <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">관찰 가능</p>
        <p style="font-size: 8pt; color: #2d2a26; line-height: 1.45;">입출력으로 판단</p>
      </div>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 10pt 18pt; margin-top: 12pt;">
    <p style="font-size: 10pt; color: #faf8f5; line-height: 1.4; font-style: italic;">"5분짜리 에이전트 여럿을 합치면 — <span style="color: #c45a3b; font-weight: 700;">장시간 에이전트 없이 장시간 시스템</span>이 나온다."</p>
    <p style="font-size: 8pt; color: #6b6560; margin-top: 3pt;">— Paul Fruitful (Claude Code 하네스 분석)</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">67</p>
  </div>
</body>
</html>
