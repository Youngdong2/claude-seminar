<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
    .step {
      background: #faf8f5;
      border: 1pt solid #e8e1d5;
      border-radius: 4pt;
      padding: 5pt 10pt;
      font-size: 9pt;
      color: #2d2a26;
      white-space: nowrap;
    }
    .step.dark {
      background: #2d2a26;
      color: #faf8f5;
      border-color: #2d2a26;
      font-weight: 600;
    }
    .step.accent {
      background: #c45a3b;
      color: #fff;
      border-color: #c45a3b;
      font-weight: 600;
    }
    .step.muted {
      background: #e8e1d5;
      color: #6b6560;
    }
    .arrow {
      font-size: 12pt;
      color: #a09a94;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 7</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">OCR 다음의 한 단계</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 16pt;">글자 추출 → layout 분석 → 구조 재구성</p>

  <div style="background: #f0ebe3; border-radius: 6pt; padding: 14pt 16pt; margin-bottom: 10pt;">
    <p style="font-size: 9pt; font-weight: 700; color: #6b6560; margin-bottom: 10pt;">일반 OCR 파이프라인</p>
    <div style="display: flex; align-items: center; gap: 7pt; flex-wrap: wrap;">
      <div class="step">PDF</div>
      <p class="arrow">→</p>
      <div class="step">이미지 변환</div>
      <p class="arrow">→</p>
      <div class="step">OCR · 글자 + 좌표</div>
      <p class="arrow">→</p>
      <div class="step muted">한 줄씩 나열</div>
      <p style="font-size: 9pt; color: #6b6560; margin-left: 10pt;">글자만</p>
    </div>
  </div>

  <div style="background: #f0ebe3; border-radius: 6pt; padding: 14pt 16pt; margin-bottom: 12pt; border-left: 3pt solid #c45a3b;">
    <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 10pt;">Upstage 파이프라인</p>
    <div style="display: flex; align-items: center; gap: 7pt; flex-wrap: wrap;">
      <div class="step">PDF</div>
      <p class="arrow">→</p>
      <div class="step">OCR · 글자 + 좌표</div>
      <p class="arrow">→</p>
      <div class="step accent">★ Layout 분석</div>
      <p class="arrow">→</p>
      <div class="step dark">표·차트·헤딩 분류</div>
      <p style="font-size: 9pt; color: #c45a3b; margin-left: 10pt; font-weight: 600;">글자 + 구조</p>
    </div>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 12pt 18pt;">
    <p style="font-size: 11pt; color: #faf8f5; line-height: 1.55;">
      글자만 = LLM이 추측 · <strong style="color: #c45a3b;">구조까지 = LLM이 이해</strong><br>
      <span style="font-size: 9pt; color: #d4cfc8;">스킬 = 입력 계약화 = 컨텍스트 엔지니어링</span>
    </p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">77</p>
  </div>
</body>
</html>
