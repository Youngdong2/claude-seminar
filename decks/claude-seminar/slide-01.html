<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      height: 405pt;

      background: #faf8f5;

    }

<body>
  <div style="display: flex; justify-content: space-between; align-items: center;">

  <div style="display: flex; gap: 64pt;">
    <div>
      <p style="font-size: 9pt; color: #6b6560; margin-bottom: 4pt;">발표자</p>
      <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">김영동</p>
    </div>
    <div>
      <p style="font-size: 9pt; color: #6b6560; margin-bottom: 4pt;">일시</p>
      <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">2026년 5월 8일</p>
    </div>
