<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">내장 도구 — 5가지 범주, 20개+</h2>
  </div>

  <!-- 도구 범주 -->
  <div style="display: flex; flex-direction: column; gap: 8pt;">
    <div style="display: grid; grid-template-columns: 140pt 1fr; gap: 12pt; background: #f0ebe3; border-radius: 6pt; padding: 14pt 20pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #2d2a26;">파일 작업</p>
      <p style="font-size: 11pt; color: #6b6560;">파일 읽기, 코드 편집, 새 파일 생성, 이름 변경 및 재구성</p>
    </div>
    <div style="display: grid; grid-template-columns: 140pt 1fr; gap: 12pt; background: #f0ebe3; border-radius: 6pt; padding: 14pt 20pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #2d2a26;">검색</p>
      <p style="font-size: 11pt; color: #6b6560;">패턴으로 파일 찾기, 정규식으로 콘텐츠 검색, 코드베이스 탐색</p>
    </div>
    <div style="display: grid; grid-template-columns: 140pt 1fr; gap: 12pt; background: #2d2a26; border-radius: 8pt; padding: 14pt 20pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #c45a3b;">실행</p>
      <p style="font-size: 11pt; color: #a09a94;">셸 명령 실행, 서버 시작, 테스트 실행, git 사용</p>
    </div>
    <div style="display: grid; grid-template-columns: 140pt 1fr; gap: 12pt; background: #f0ebe3; border-radius: 6pt; padding: 14pt 20pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #2d2a26;">웹</p>
      <p style="font-size: 11pt; color: #6b6560;">웹 검색, 문서 가져오기, 오류 메시지 조회</p>
    </div>
    <div style="display: grid; grid-template-columns: 140pt 1fr; gap: 12pt; background: #f0ebe3; border-radius: 6pt; padding: 14pt 20pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #2d2a26;">코드 인텔리전스</p>
      <p style="font-size: 11pt; color: #6b6560;">타입 오류/경고 확인, 정의로 이동, 참조 찾기</p>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">20</p>
  </div>
</body>
</html>
