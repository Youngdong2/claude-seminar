<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 48pt 64pt;
      display: flex; flex-direction: column; justify-content: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt; text-align: center;">추상화의 역사 — 1단계</p>

  <div style="display: flex; align-items: center; gap: 32pt;">
    <div style="flex: 1;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560; margin-bottom: 6pt;">어셈블리</p>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 14pt 20pt; margin-bottom: 12pt;">
        <p style="font-family: monospace; font-size: 11pt; color: #6b9e8a; line-height: 1.7;">mov ah, 09h<br>mov dx, msg<br>int 21h</p>
      </div>
      <div style="text-align: center; margin-bottom: 12pt;">
        <p style="font-size: 18pt; color: #c45a3b;">↓</p>
      </div>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 16pt 20pt;">
        <p style="font-family: monospace; font-size: 16pt; color: #87ceeb;">printf("Hello");</p>
      </div>
    </div>
    <div style="flex: 0.8;">
      <p style="font-size: 28pt; font-weight: 700; color: #2d2a26; line-height: 1.3;">C 언어</p>
      <p style="font-size: 12pt; color: #6b6560; margin-top: 12pt; line-height: 1.6;"><em>"기계를 직접 다루지 않으면<br>개발자가 아니다"</em></p>
    </div>
  </div>
</body>
</html>
