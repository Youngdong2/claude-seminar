<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 4</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">하네스를 구성하는 4가지 도구</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 16pt;">Claude Code가 제공하는 확장 축. 이 4가지를 조합해 하네스 구축.</p>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12pt; margin-bottom: 14pt;">
    <div style="background: #2d2a26; border-radius: 8pt; padding: 18pt 14pt; text-align: center;">
      <p style="font-size: 14pt; font-weight: 700; color: #c45a3b; margin-bottom: 8pt;">CLAUDE.md</p>
      <p style="font-size: 9.5pt; color: #a09a94; line-height: 1.5;">프로젝트 규칙<br>세션마다 자동 로드</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 18pt 14pt; text-align: center;">
      <p style="font-size: 14pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">Skills</p>
      <p style="font-size: 9.5pt; color: #6b6560; line-height: 1.5;">재사용 워크플로우<br><code style="background: #e8e1d5; padding: 1pt 4pt; border-radius: 2pt; font-size: 8.5pt;">/명령</code>으로 호출</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 18pt 14pt; text-align: center;">
      <p style="font-size: 14pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">Hooks</p>
      <p style="font-size: 9.5pt; color: #6b6560; line-height: 1.5;">이벤트 기반 자동화<br>LLM 우회 — 강제 실행</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 18pt 14pt; text-align: center;">
      <p style="font-size: 14pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">Plugins</p>
      <p style="font-size: 9.5pt; color: #6b6560; line-height: 1.5;">팀 단위 배포 패키지<br>npm install로 공유</p>
    </div>
  </div>

  <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 10pt 16pt;">
    <p style="font-size: 10pt; color: #2d2a26; line-height: 1.4;"><strong>강제력 순서</strong>: CLAUDE.md(권고) → Skills(호출 시) → Hooks(자동 차단) → Plugins(팀 배포)</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">43</p>
  </div>
</body>
</html>
