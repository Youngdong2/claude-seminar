<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 18pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 3</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">방법론 비교</h2>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6pt;">
    <!-- 헤더 -->
    <div style="display: grid; grid-template-columns: 130pt 1fr 1fr; gap: 10pt; padding: 0 14pt;">
      <p style="font-size: 9pt;"></p>
      <p style="font-size: 10pt; font-weight: 700; color: #2d2a26; text-align: center;">TDD</p>
      <p style="font-size: 10pt; font-weight: 700; color: #2d2a26; text-align: center;">SDD</p>
    </div>
    <!-- 인간의 역할 -->
    <div style="display: grid; grid-template-columns: 130pt 1fr 1fr; gap: 10pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt; align-items: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26;">인간의 역할</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">테스트 작성자</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">스펙 작성자</p>
    </div>
    <!-- 검증 방식 -->
    <div style="display: grid; grid-template-columns: 130pt 1fr 1fr; gap: 10pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt; align-items: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26;">검증 방식</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">자동 테스트</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">스펙 검증</p>
    </div>
    <!-- 프로덕션 적합도 -->
    <div style="display: grid; grid-template-columns: 130pt 1fr 1fr; gap: 10pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt; align-items: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26;">프로덕션 적합도</p>
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26; text-align: center;">높음</p>
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26; text-align: center;">높음</p>
    </div>
    <!-- 최적 장면 -->
    <div style="display: grid; grid-template-columns: 130pt 1fr 1fr; gap: 10pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt; align-items: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #2d2a26;">최적 장면</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">기존 코드 수정 · 버그 수정</p>
      <p style="font-size: 10pt; color: #6b6560; text-align: center;">신규 기능 · 대규모 설계</p>
    </div>
  </div>

  <!-- 결론 -->
  <div style="background: #2d2a26; border-radius: 8pt; padding: 16pt 24pt; margin-top: 16pt;">
    <p style="font-size: 12pt; color: #faf8f5; text-align: center;">
      가장 강력한 조합 — <span style="font-weight: 600; color: #c45a3b;">SDD로 정의 + TDD로 검증</span>
    </p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">32</p>
  </div>
</body>
</html>
