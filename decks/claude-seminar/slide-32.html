<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 20pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 3</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">ADD — 에이전트 주도 개발</h2>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 14pt 24pt; margin-bottom: 20pt;">
    <p style="font-size: 12pt; color: #faf8f5; text-align: center;">"어떻게 구현할까?" → <span style="color: #c45a3b; font-weight: 600;">"에이전트가 올바르게 구현하도록 어떻게 안내할까?"</span></p>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20pt;">
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 20pt;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 10pt;">에이전트가 하는 것</p>
      <div style="display: flex; flex-direction: column; gap: 6pt;">
        <p style="font-size: 11pt; color: #2d2a26;">코드 검색, 읽기, 작성</p>
        <p style="font-size: 11pt; color: #2d2a26;">셸 명령 실행, 테스트</p>
        <p style="font-size: 11pt; color: #2d2a26;">패키지 설치, 의존성 관리</p>
        <p style="font-size: 11pt; color: #2d2a26;">문서 생성</p>
      </div>
    </div>
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 20pt;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 10pt;">인간이 소유하는 것</p>
      <div style="display: flex; flex-direction: column; gap: 6pt;">
        <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">전략적 의사결정 (무엇을 만들지)</p>
        <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">아키텍처 선택</p>
        <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">보안 검증</p>
        <p style="font-size: 11pt; font-weight: 500; color: #2d2a26;">최종 품질 검증</p>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">29</p>
  </div>
</body>
</html>
