<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 7</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">두 가지 막다른 길</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 10pt;">하네스 · 에이전트 · 컨텍스트 방어 · 암묵지 문서화 — 배울 것이 많음.</p>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10pt;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 11pt; font-weight: 700; color: #2d2a26; margin-bottom: 6pt;">직접 다 세팅</p>
      <div style="display: flex; flex-direction: column; gap: 4pt;">
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 한 번 세팅해도 업데이트 안 됨</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 팀에 공유되지 않음</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 시간이 지나면 맥락 휘발</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· → <strong style="color: #c45a3b;">번아웃</strong></p>
      </div>
    </div>

    <div style="background: #f0ebe3; border-radius: 6pt; padding: 10pt 14pt;">
      <p style="font-size: 11pt; font-weight: 700; color: #2d2a26; margin-bottom: 6pt;">원리 없이 스킬만</p>
      <div style="display: flex; flex-direction: column; gap: 4pt;">
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 이상 동작 시 원인 판단 불가</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 같은 실수를 반복</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· 디버깅할 수 없음</p>
        <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">· → <strong style="color: #c45a3b;">블랙박스 의존</strong></p>
      </div>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 12pt 20pt; margin-top: 10pt;">
    <p style="font-size: 12pt; color: #faf8f5; line-height: 1.4;"><strong style="color: #c45a3b;">원리는 이해</strong> · <strong style="color: #c45a3b;">구현은 위임</strong> — 잘 만들어진 플러그인 활용.</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">70</p>
  </div>
</body>
</html>
