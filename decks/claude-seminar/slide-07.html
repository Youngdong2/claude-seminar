<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 48pt 64pt;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt;">추상화의 역사 — 그리고 지금</p>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 20pt 40pt; margin-bottom: 28pt;">
    <p style="font-size: 18pt; color: #87ceeb;">"이 함수를 리팩토링하고 테스트를 작성해줘"</p>
  </div>

  <p style="font-size: 16pt; color: #6b6560; text-decoration: line-through;">"이건 진짜 개발이 아니다"</p>
</body>
</html>
