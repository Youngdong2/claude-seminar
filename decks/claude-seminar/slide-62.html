<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 5</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">그래도 여전히 중요한 기초</h2>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 14pt 22pt; margin-bottom: 10pt;">
    <p style="font-size: 13pt; color: #faf8f5; line-height: 1.4;"><em>"AI가 다 해주니까 코드 안 배워도 되겠다"</em></p>
    <p style="font-size: 10pt; color: #c45a3b; margin-top: 4pt; font-weight: 600;">— 가장 위험한 생각</p>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10pt;">
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.55;">AI의 <strong>자신감 있게 틀린 코드</strong> 제시 — 기초 없으면 틀림 감지 불가</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.55;">추상화 수준만 올라갔을 뿐, <strong>문제 해결 · 시스템 사고 · 디버깅</strong>은 여전히 필수</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.55;">진입장벽은 낮아졌으나, 고품질 역량은 <strong>오히려 더 구조화</strong></p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">62</p>
  </div>
</body>
</html>
