<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }

<body>
  <div style="background: #2d2a26; border-radius: 8pt; padding: 32pt 48pt; margin-bottom: 28pt;">
    <p style="font-size: 22pt; font-weight: 500; color: #faf8f5; line-height: 1.7;">

      <span style="color: #c45a3b; font-weight: 700;">코드 한 줄 없이</span> 만든 방법
    </p>
  </div>

  <p style="font-size: 15pt; color: #2d2a26; font-weight: 500; line-height: 1.6; margin-bottom: 12pt;">
    한 것은 하나 — <span style="color: #c45a3b; font-weight: 600;">하네스 설계</span>
  </p>

  <p style="font-size: 11pt; color: #6b6560; line-height: 1.5;">
    이 감각이 오늘의 목적지
  </p>

</html>
