<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 1</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">개발자의 새로운 역할</h2>
  </div>

  <!-- 흐름도 + 비유 -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32pt;">
    <!-- 왼쪽: 흐름도 -->
    <div style="display: flex; flex-direction: column; justify-content: center; gap: 0;">
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 16pt 20pt; text-align: center;">
        <p style="font-size: 13pt; font-weight: 500; color: #2d2a26;">코드를 잘 짜는 능력</p>
      </div>
      <div style="text-align: center; padding: 6pt 0;">
        <p style="font-size: 16pt; color: #c45a3b;">↓</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 6pt; padding: 16pt 20pt; text-align: center;">
        <p style="font-size: 13pt; font-weight: 500; color: #2d2a26;">문서를 잘 쓰는 능력</p>
      </div>
      <div style="text-align: center; padding: 6pt 0;">
        <p style="font-size: 16pt; color: #c45a3b;">↓</p>
      </div>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 18pt 22pt; text-align: center;">
        <p style="font-size: 16pt; font-weight: 600; color: #faf8f5;">컨텍스트를 설계하는 능력</p>
      </div>
    </div>

    <!-- 오른쪽: 비유 (보조) -->
    <div style="display: flex; flex-direction: column; justify-content: center; gap: 18pt;">
      <p style="font-size: 8.5pt; font-weight: 700; color: #c45a3b; letter-spacing: 0.06em;">비유로 보면</p>
      <div style="border-left: 2pt solid #c45a3b; padding-left: 14pt;">
        <p style="font-size: 12pt; font-weight: 600; color: #2d2a26; margin-bottom: 4pt;">건축가</p>
        <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">벽돌 쌓기 대신 설계도 작성</p>
      </div>
      <div style="border-left: 2pt solid #c45a3b; padding-left: 14pt;">
        <p style="font-size: 12pt; font-weight: 600; color: #2d2a26; margin-bottom: 4pt;">오케스트라 지휘자</p>
        <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">직접 연주 대신 전체 조율<br>CLAUDE.md = 총보</p>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">13</p>
  </div>
</body>
</html>
