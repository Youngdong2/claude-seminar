<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 48pt 64pt;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt;">왜 생태계가 중요한가</p>

  <div style="background: #2d2a26; border-radius: 10pt; padding: 28pt 48pt; margin-bottom: 28pt;">
    <p style="font-size: 17pt; font-weight: 500; color: #faf8f5; line-height: 1.7;">
      도구의 기능 → 시간이 지나면 추격 가능.<br>
      <span style="color: #c45a3b; font-weight: 600;">커뮤니티가 만든 플러그인·스킬·노하우·교육 자료</span> → 복제 불가.
    </p>
  </div>

  <p style="font-size: 14pt; color: #6b6560; line-height: 1.6;">
    문제가 생겼을 때 검색하면 답이 나오는 환경<br>
    = <span style="font-weight: 600; color: #2d2a26;">실무 도입의 핵심 조건</span>
  </p>
</body>
</html>
