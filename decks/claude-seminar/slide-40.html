<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 24pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 4</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">Agent = Model + Harness</h2>
  </div>

  <p style="font-size: 11pt; color: #6b6560; margin-bottom: 20pt; font-style: italic;">"If you're not the model, you're the harness." — LangChain, Vivek Trivedy</p>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20pt;">
    <!-- 모델 -->
    <div style="display: flex; flex-direction: column; gap: 12pt;">
      <div style="background: #f0ebe3; border-radius: 8pt; padding: 20pt; text-align: center;">
        <p style="font-size: 28pt; font-weight: 700; color: #2d2a26; margin-bottom: 8pt;">Model</p>
        <p style="font-size: 11pt; color: #6b6560;">텍스트를 생성한다</p>
      </div>
      <div style="background: #f0ebe3; border-radius: 8pt; padding: 14pt 20pt;">
        <p style="font-size: 10pt; font-weight: 600; color: #2d2a26; margin-bottom: 6pt;">비유: CPU</p>
        <p style="font-size: 10pt; color: #6b6560; line-height: 1.5;">명령어를 실행하지만<br>OS 없는 CPU는 발열체</p>
      </div>
    </div>
    <!-- 하네스 -->
    <div style="display: flex; flex-direction: column; gap: 12pt;">
      <div style="background: #2d2a26; border-radius: 8pt; padding: 20pt; text-align: center;">
        <p style="font-size: 28pt; font-weight: 700; color: #c45a3b; margin-bottom: 8pt;">Harness</p>
        <p style="font-size: 11pt; color: #6b6560;">환경을 결정한다</p>
      </div>
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 14pt 20pt;">
        <p style="font-size: 10pt; color: #2d2a26; line-height: 1.6;">
          모델이 <strong>무엇을 보는지</strong> — 컨텍스트<br>
          모델이 <strong>무엇을 할 수 있는지</strong> — 도구·권한<br>
          모델이 <strong>언제 멈추는지</strong> — 제약<br>
          잘못됐을 때 <strong>무엇이 일어나는지</strong> — 복구
        </p>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">40</p>
  </div>
</body>
</html>
