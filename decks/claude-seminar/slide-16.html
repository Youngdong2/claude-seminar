<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 28pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">에이전틱 코딩의 실제 성과</h2>
  </div>

  <!-- 숫자 카드 -->
  <div style="flex: 1; display: flex; gap: 16pt;">
    <div style="flex: 1; background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 42pt; font-weight: 700; color: #c45a3b; line-height: 1;">2주</p>
      <p style="font-size: 11pt; color: #2d2a26; font-weight: 500; margin-top: 12pt;">CTO 추정 <strong>4~8개월</strong> 프로젝트를<br>에이전틱 코딩으로 완료</p>
      <p style="font-size: 9pt; color: #6b6560; margin-top: 8pt;">Augment Code + Vertex AI</p>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 42pt; font-weight: 700; color: #c45a3b; line-height: 1;">1~2일</p>
      <p style="font-size: 11pt; color: #2d2a26; font-weight: 500; margin-top: 12pt;">신규 개발자 온보딩<br>기존 <strong>수주~수개월</strong>에서 단축</p>
      <p style="font-size: 9pt; color: #6b6560; margin-top: 8pt;">첫날부터 의미 있는 기여 가능</p>
    </div>
    <div style="flex: 1; background: #2d2a26; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 28pt; font-weight: 700; color: #c45a3b; line-height: 1.2;">복합<br>효과</p>
      <p style="font-size: 11pt; color: #a09a94; font-weight: 500; margin-top: 12pt;">불가능해 보이던 작업 실현<br>기술 부채 점진적 해결<br>즉각적 사용자 피드백 대응</p>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">13</p>
  </div>
</body>
</html>
