<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 6</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">Sub-Agent — 가장 자주 쓰는 패턴</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 16pt;">가장 <strong style="color: #2d2a26;">과소평가된</strong> 패턴 — 일상 작업의 80%는 여기서 해결.</p>

  <div style="display: grid; grid-template-columns: 1.15fr 1fr; gap: 16pt;">
    <!-- Left: diagram -->
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 16pt 18pt; display: flex; flex-direction: column;">
      <svg viewBox="0 0 320 180" style="width: 100%; flex: 1;">
        <!-- Main context box -->
        <rect x="10" y="60" width="90" height="60" rx="6" fill="#2d2a26"/>
        <text x="55" y="85" text-anchor="middle" font-family="Pretendard" font-size="11" font-weight="700" fill="#faf8f5">Main</text>
        <text x="55" y="100" text-anchor="middle" font-family="Pretendard" font-size="8" fill="#c45a3b">컨텍스트 = 금</text>

        <!-- Sub context box (isolated, dashed border) -->
        <rect x="200" y="20" width="110" height="140" rx="6" fill="#faf8f5" stroke="#c45a3b" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="255" y="38" text-anchor="middle" font-family="Pretendard" font-size="8" font-weight="600" fill="#c45a3b">격리된 컨텍스트</text>

        <!-- Sub-agent circle -->
        <circle cx="255" cy="70" r="18" fill="#f0ebe3" stroke="#2d2a26" stroke-width="1.5"/>
        <text x="255" y="73" text-anchor="middle" font-family="Pretendard" font-size="9" font-weight="700" fill="#2d2a26">Sub</text>

        <!-- Files being read (trash) -->
        <rect x="220" y="100" width="14" height="18" fill="#6b6560" opacity="0.3" rx="1"/>
        <rect x="240" y="102" width="14" height="18" fill="#6b6560" opacity="0.3" rx="1"/>
        <rect x="260" y="100" width="14" height="18" fill="#6b6560" opacity="0.3" rx="1"/>
        <rect x="280" y="103" width="14" height="18" fill="#6b6560" opacity="0.3" rx="1"/>
        <text x="257" y="138" text-anchor="middle" font-family="Pretendard" font-size="7" fill="#6b6560">50k+ 토큰 읽어도 OK</text>
        <text x="257" y="150" text-anchor="middle" font-family="Pretendard" font-size="7" fill="#6b6560">메인은 오염 안됨</text>

        <!-- Arrow: task down -->
        <path d="M 100 78 L 195 55" stroke="#c45a3b" stroke-width="1.5" fill="none" marker-end="url(#a1)"/>
        <text x="145" y="58" text-anchor="middle" font-family="Pretendard" font-size="7" font-weight="600" fill="#c45a3b">task</text>

        <!-- Arrow: summary back -->
        <path d="M 195 100 L 100 108" stroke="#2d2a26" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
        <text x="145" y="122" text-anchor="middle" font-family="Pretendard" font-size="7" font-weight="600" fill="#2d2a26">summary (1-2k)</text>

        <defs>
          <marker id="a1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c45a3b"/></marker>
          <marker id="a2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2d2a26"/></marker>
        </defs>
      </svg>
    </div>

    <!-- Right: benefits -->
    <div style="display: flex; flex-direction: column; gap: 10pt; justify-content: center;">
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
        <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">컨텍스트 격리</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.5;">파일 50개 뒤져도 메인 오염 없음</p>
      </div>
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
        <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">도구 제한</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.5;">읽기 전용만 허용 → 사고 원천 차단</p>
      </div>
      <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
        <p style="font-size: 10pt; font-weight: 700; color: #c45a3b; margin-bottom: 3pt;">정보 격리 = 치팅 차단</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.5;">Tester는 구현 못 봄 · Impl은 스펙 못 봄</p>
      </div>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 10pt 18pt; margin-top: 12pt;">
    <p style="font-size: 11pt; color: #faf8f5; line-height: 1.4;">메인 컨텍스트 = <span style="color: #c45a3b; font-weight: 700;">금</span> &nbsp;·&nbsp; 서브에이전트의 산출 = <span style="color: #c45a3b; font-weight: 700;">요약</span></p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">63</p>
  </div>
</body>
</html>
