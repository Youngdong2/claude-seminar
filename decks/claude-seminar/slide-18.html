<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">에이전틱 코딩의 실제 성과</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 18pt;">한 사례가 다 말한다 — 4~8개월짜리를 2주만에</p>

  <div style="flex: 1; display: grid; grid-template-columns: 1.4fr 1fr; gap: 14pt;">
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 24pt 26pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 56pt; font-weight: 700; color: #c45a3b; line-height: 1; margin-bottom: 14pt;">2주</p>
      <p style="font-size: 12pt; color: #2d2a26; line-height: 1.5;">CTO 추정 <strong>4~8개월</strong> 프로젝트<br>에이전틱 코딩으로 완료</p>
      <p style="font-size: 9pt; color: #6b6560; margin-top: 14pt;">Augment Code + Vertex AI</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12pt;">
      <div style="flex: 1; background: #f0ebe3; border-radius: 6pt; padding: 16pt 18pt;">
        <p style="font-size: 26pt; font-weight: 700; color: #c45a3b; line-height: 1; margin-bottom: 8pt;">1~2일</p>
        <p style="font-size: 9.5pt; color: #2d2a26; line-height: 1.5;">신규 개발자 온보딩<br>기존 <strong>수주~수개월</strong>에서 단축</p>
      </div>
      <div style="flex: 1; background: #2d2a26; border-radius: 6pt; padding: 16pt 18pt; display: flex; flex-direction: column; justify-content: center;">
        <p style="font-size: 11pt; font-weight: 700; color: #c45a3b; margin-bottom: 6pt;">복합 효과</p>
        <p style="font-size: 9.5pt; color: #d4cfc8; line-height: 1.55;">불가능하던 작업 실현<br>기술 부채 해결 · 즉각 피드백</p>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">18</p>
  </div>
</body>
</html>
