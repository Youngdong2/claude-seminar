<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">AI 코딩 도구 비교</h2>
  </div>

  <!-- 테이블 -->
  <div style="display: flex; flex-direction: column; gap: 8pt;">
    <!-- 헤더 행 -->
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; padding: 0 16pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560;">도구</p>
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560;">형태</p>
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560;">특징</p>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 16pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26; display: flex; align-items: center; gap: 8pt;"><img src="./assets/githubcopilot.svg" style="width: 16pt; height: 16pt; filter: brightness(0);">GitHub Copilot</p>
      <p style="font-size: 11pt; color: #6b6560;">IDE 플러그인</p>
      <p style="font-size: 11pt; color: #6b6560;">코드 자동완성 중심, 가장 대중적</p>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 16pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26; display: flex; align-items: center; gap: 8pt;"><img src="./assets/cursor.svg" style="width: 16pt; height: 16pt; filter: brightness(0);">Cursor</p>
      <p style="font-size: 11pt; color: #6b6560;">IDE</p>
      <p style="font-size: 11pt; color: #6b6560;">AI 네이티브 에디터, 에이전틱 기능 내장</p>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 16pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26; display: flex; align-items: center; gap: 8pt;"><img src="./assets/globe.svg" style="width: 16pt; height: 16pt; filter: brightness(0);">Windsurf</p>
      <p style="font-size: 11pt; color: #6b6560;">IDE</p>
      <p style="font-size: 11pt; color: #6b6560;">에이전틱 IDE, Cascade 에이전트</p>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; background: #f0ebe3; border-radius: 6pt; padding: 12pt 16pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 500; color: #2d2a26; display: flex; align-items: center; gap: 8pt;"><img src="./assets/openai.svg" style="width: 16pt; height: 16pt; filter: brightness(0);">Codex (OpenAI)</p>
      <p style="font-size: 11pt; color: #6b6560;">터미널 CLI</p>
      <p style="font-size: 11pt; color: #6b6560;">에이전틱, 로컬 실행, 확장 레이어 구조</p>
    </div>
    <div style="display: grid; grid-template-columns: 2fr 1.5fr 3fr; gap: 8pt; background: #2d2a26; border-radius: 6pt; padding: 12pt 16pt; align-items: center;">
      <p style="font-size: 12pt; font-weight: 600; color: #faf8f5; display: flex; align-items: center; gap: 8pt;"><img src="./assets/claude.svg" style="width: 16pt; height: 16pt;">Claude Code</p>
      <p style="font-size: 11pt; color: #a09a94;">터미널 CLI</p>
      <p style="font-size: 11pt; font-weight: 500; color: #c45a3b;">에이전틱, 로컬 실행, 확장 레이어 구조</p>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">18</p>
  </div>
</body>
</html>
