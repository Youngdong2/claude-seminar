<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 48pt 64pt;
      display: flex; flex-direction: column; justify-content: center;
    }
  </style>
</head>
<body>
  <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; letter-spacing: 0.06em; margin-bottom: 24pt;">추상화의 역사 — 2단계</p>

  <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 24pt; align-items: center;">
    <div>
      <p style="font-size: 14pt; font-weight: 700; color: #2d2a26; text-align: center; margin-bottom: 12pt;">C</p>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 16pt 20pt; position: relative;">
        <p style="font-family: monospace; font-size: 11pt; color: #6b9e8a; line-height: 1.8;">ptr = malloc(size);<br>// ... use ptr ...<br>free(ptr);</p>
        <div style="position: absolute; top: 50%; left: 8pt; right: 8pt; height: 2pt; background: #c45a3b;"></div>
      </div>
    </div>
    <div>
      <p style="font-size: 24pt; color: #c45a3b;">→</p>
    </div>
    <div>
      <p style="font-size: 14pt; font-weight: 700; color: #2d2a26; text-align: center; margin-bottom: 12pt;">Java</p>
      <div style="background: #2d2a26; border-radius: 8pt; padding: 16pt 20pt;">
        <p style="font-family: monospace; font-size: 11pt; color: #87ceeb; line-height: 1.8;">Object obj = new Object();<br>// ... use obj ...<br>// GC handles cleanup</p>
      </div>
    </div>
  </div>

  <p style="font-size: 16pt; font-weight: 600; color: #c45a3b; text-align: center; margin-top: 28pt;">"메모리 직접 관리 안 하면 개발이 아니다"</p>
</body>
</html>
