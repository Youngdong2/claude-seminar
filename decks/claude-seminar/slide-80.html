<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 8</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">원칙은 그대로, 예시만 교체</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 12pt;"><strong style="color: #2d2a26;">코드가 아닌 업무</strong>로 치환. 원칙은 그대로, 예시만 상이.</p>

  <div style="background: #f0ebe3; border-radius: 6pt; padding: 14pt 18pt; margin-bottom: 14pt;">
    <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 10pt 18pt;">
      <p style="font-size: 9pt; font-weight: 700; color: #6b6560; border-bottom: 1pt solid rgba(0,0,0,0.12); padding-bottom: 4pt;">발표의 원칙</p>
      <p style="font-size: 9pt; font-weight: 700; color: #6b6560; border-bottom: 1pt solid rgba(0,0,0,0.12); padding-bottom: 4pt;">업무로 번역</p>

      <p style="font-size: 10pt; color: #2d2a26; font-weight: 600;">Spec-first</p>
      <p style="font-size: 10pt; color: #6b6560;">원하는 것을 <strong style="color: #2d2a26;">글로 먼저</strong></p>

      <p style="font-size: 10pt; color: #2d2a26; font-weight: 600;">CLAUDE.md</p>
      <p style="font-size: 10pt; color: #6b6560;">규칙·용어·판단 기준을 <strong style="color: #2d2a26;">하나의 파일로</strong></p>

      <p style="font-size: 10pt; color: #2d2a26; font-weight: 600;">검증 분리</p>
      <p style="font-size: 10pt; color: #6b6560;">초안과 <strong style="color: #2d2a26;">검토를 다른 에이전트로</strong></p>

      <p style="font-size: 10pt; color: #2d2a26; font-weight: 600;">암묵지 명시화</p>
      <p style="font-size: 10pt; color: #6b6560;">머릿속 판단을 <strong style="color: #2d2a26;">예시와 함께 글로</strong></p>
    </div>
  </div>

  <div style="background: #2d2a26; border-radius: 8pt; padding: 12pt 18pt;">
    <p style="font-size: 11pt; color: #faf8f5; text-align: center;">변한 것은 <strong style="color: #c45a3b;">예시뿐</strong> — 원칙은 그대로, 새로 배울 것 없음</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">80</p>
  </div>
</body>
</html>
