<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 3</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">구조화 수준 스펙트럼</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 20pt;">왼쪽일수록 자유 · 오른쪽일수록 엄격.</p>

  <div style="flex: 1; display: flex; gap: 14pt; align-items: stretch;">
    <div style="flex: 1; background: #f0ebe3; border-radius: 6pt; padding: 20pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <p style="font-size: 16pt; font-weight: 700; color: #2d2a26;">PDD</p>
      <p style="font-size: 10pt; color: #6b6560; margin-top: 6pt;">프롬프트 주도</p>
      <div style="width: 100%; height: 2pt; background: #ddd8d0; margin: 12pt 0;"></div>
      <p style="font-size: 10pt; color: #c45a3b; font-weight: 500;">의도</p>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 20pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <p style="font-size: 16pt; font-weight: 700; color: #2d2a26;">TDD</p>
      <p style="font-size: 10pt; color: #6b6560; margin-top: 6pt;">테스트 주도</p>
      <div style="width: 100%; height: 2pt; background: #ddd8d0; margin: 12pt 0;"></div>
      <p style="font-size: 10pt; color: #c45a3b; font-weight: 500;">검증</p>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 20pt; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
      <p style="font-size: 16pt; font-weight: 700; color: #2d2a26;">SDD</p>
      <p style="font-size: 10pt; color: #6b6560; margin-top: 6pt;">스펙 주도</p>
      <div style="width: 100%; height: 2pt; background: #ddd8d0; margin: 12pt 0;"></div>
      <p style="font-size: 10pt; color: #c45a3b; font-weight: 500;">계획</p>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">낮은 구조화 ← → 높은 구조화</p>
    <p style="font-size: 9pt; color: #6b6560;">30</p>
  </div>
</body>
</html>
