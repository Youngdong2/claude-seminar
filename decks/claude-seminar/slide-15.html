<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">AI 코딩 도구의 진화 3단계</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 18pt;">자동완성 → 대화형 → 에이전틱. 단계마다 컨텍스트 범위가 넓어짐</p>

  <div style="display: flex; align-items: center; gap: 10pt; margin-top: 14pt;">
    <div style="flex: 1; background: #f0ebe3; border-radius: 6pt; padding: 14pt 14pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560; margin-bottom: 4pt;">1단계</p>
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; margin-bottom: 10pt;">자동완성</p>
      <p style="font-size: 8.5pt; color: #6b6560; line-height: 1.5;">IDE가 다음 줄 예측</p>
      <p style="font-size: 8pt; color: #a09a94; margin-top: 8pt;">한계 · 컨텍스트 제한</p>
    </div>

    <p style="font-size: 14pt; color: #a09a94; flex-shrink: 0;">→</p>

    <div style="flex: 1.3; background: #f0ebe3; border-radius: 6pt; padding: 18pt 16pt;">
      <p style="font-size: 9pt; font-weight: 600; color: #6b6560; margin-bottom: 4pt;">2단계</p>
      <p style="font-size: 16pt; font-weight: 600; color: #2d2a26; margin-bottom: 10pt;">대화형 채팅</p>
      <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">코드 토론 · 버그 설명</p>
      <p style="font-size: 8pt; color: #a09a94; margin-top: 8pt;">한계 · 다중 파일 수동</p>
    </div>

    <p style="font-size: 16pt; color: #c45a3b; flex-shrink: 0; font-weight: 600;">→</p>

    <div style="flex: 1.7; background: #2d2a26; border-radius: 8pt; padding: 22pt 20pt;">
      <p style="font-size: 9pt; font-weight: 700; color: #c45a3b; margin-bottom: 4pt;">3단계 · 지금 여기 ★</p>
      <p style="font-size: 19pt; font-weight: 600; color: #faf8f5; margin-bottom: 10pt;">에이전틱 코딩</p>
      <p style="font-size: 9pt; color: #d4cfc8; line-height: 1.6;">목표 분해 · 독립 실행<br>전체 코드베이스 이해</p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">15</p>
  </div>
</body>
</html>
