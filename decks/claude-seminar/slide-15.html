<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 28pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">개발 패러다임 전환</h2>
  </div>

  <!-- 비교 -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24pt;">
    <!-- 기존 -->
    <div style="background: #f0ebe3; border-radius: 8pt; padding: 18pt 20pt; text-align: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #6b6560; margin-bottom: 10pt;">기존 개발</p>
      <div style="display: flex; flex-direction: column; gap: 4pt; align-items: center;">
        <p style="font-size: 11pt; color: #2d2a26;">코드 작성</p>
        <p style="font-size: 10pt; color: #c45a3b;">↓</p>
        <p style="font-size: 11pt; color: #2d2a26;">테스트 실행</p>
        <p style="font-size: 10pt; color: #c45a3b;">↓</p>
        <p style="font-size: 11pt; color: #2d2a26;">오류 읽기</p>
        <p style="font-size: 10pt; color: #c45a3b;">↓</p>
        <p style="font-size: 11pt; color: #2d2a26;">수정</p>
        <p style="font-size: 10pt; color: #c45a3b;">↓</p>
        <p style="font-size: 11pt; color: #6b6560;">반복...</p>
      </div>
    </div>
    <!-- 에이전틱 -->
    <div style="background: #2d2a26; border-radius: 8pt; padding: 18pt 20pt; text-align: center;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 10pt;">에이전틱 개발</p>
      <div style="display: flex; flex-direction: column; gap: 8pt; align-items: center;">
        <div style="background: #3d3a36; border-radius: 6pt; padding: 9pt 20pt; width: 100%;">
          <p style="font-size: 12pt; font-weight: 600; color: #faf8f5;">목표 정의</p>
        </div>
        <p style="font-size: 11pt; color: #c45a3b;">↓</p>
        <div style="background: #3d3a36; border-radius: 6pt; padding: 9pt 20pt; width: 100%;">
          <p style="font-size: 12pt; font-weight: 600; color: #faf8f5;">변경 검토</p>
        </div>
        <p style="font-size: 11pt; color: #c45a3b;">↓</p>
        <div style="background: #c45a3b; border-radius: 6pt; padding: 9pt 20pt; width: 100%;">
          <p style="font-size: 12pt; font-weight: 600; color: #fff;">구현 승인</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">15</p>
  </div>
</body>
</html>
