<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 8</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">사실 이 발표는 처음부터 직업 이야기가 아니었다</h2>
  </div>

  <p style="font-size: 10.5pt; color: #6b6560; margin-bottom: 12pt;">지금까지 다룬 것들을 쭉 나열해 보자.</p>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8pt 16pt; margin-bottom: 14pt;">
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">프롬프트를 잘 쓰는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">컨텍스트를 설계하는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">하네스를 만드는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">에이전트에게 역할을 나눠주는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">계획 · 실행 · 검증을 분리하는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt;">
      <p style="font-size: 9.5pt; color: #2d2a26;">암묵지를 파일로 뽑아내는 법</p>
    </div>
    <div style="background: #f0ebe3; border-radius: 5pt; padding: 8pt 14pt; grid-column: 1 / -1;">
      <p style="font-size: 9.5pt; color: #2d2a26;">직접 만들지 말고 잘 만든 것을 쓰는 법</p>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 12pt 20pt;">
    <p style="font-size: 11pt; color: #faf8f5; line-height: 1.45;">이 중에 <strong style="color: #c45a3b;">"개발자에게만"</strong> 해당하는 게 있는가? 하나도 없다.</p>
    <p style="font-size: 9.5pt; color: #6b6560; margin-top: 4pt;">전부 <strong style="color: #faf8f5;">도구를 다루는 보편 원리</strong>. 예시가 마침 코드였을 뿐.</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">87</p>
  </div>
</body>
</html>
