<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 20pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 2</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">개발 패러다임 전환</h2>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 40pt 1fr; gap: 0; align-items: center;">
    <!-- 기존 -->
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 24pt;">
      <p style="font-size: 10pt; font-weight: 600; color: #6b6560; margin-bottom: 14pt;">기존 개발</p>
      <p style="font-size: 14pt; font-weight: 600; color: #2d2a26; line-height: 1.8;">코드 작성</p>
      <p style="font-size: 14pt; color: #6b6560; line-height: 1.8;">테스트 · 오류 · 수정</p>
      <p style="font-size: 14pt; color: #6b6560; line-height: 1.8;">반복…</p>
      <div style="width: 100%; height: 1pt; background: #ddd8d0; margin: 12pt 0;"></div>
      <p style="font-size: 11pt; color: #6b6560;">인간이 <strong style="color: #2d2a26;">모든 단계를 직접</strong> 수행</p>
    </div>

    <p style="font-size: 24pt; color: #c45a3b; text-align: center;">→</p>

    <!-- 에이전틱 -->
    <div style="background: #2d2a26; border-radius: 8pt; padding: 24pt;">
      <p style="font-size: 10pt; font-weight: 600; color: #c45a3b; margin-bottom: 14pt;">에이전틱 개발</p>
      <p style="font-size: 18pt; font-weight: 700; color: #faf8f5; line-height: 1.6;">목표 정의</p>
      <p style="font-size: 14pt; color: #a09a94; line-height: 1.6;">에이전트가 실행</p>
      <p style="font-size: 18pt; font-weight: 700; color: #c45a3b; line-height: 1.6;">변경 검토 · 승인</p>
      <div style="width: 100%; height: 1pt; background: #4a4540; margin: 12pt 0;"></div>
      <p style="font-size: 11pt; color: #a09a94;">인간은 <strong style="color: #faf8f5;">의도와 판단</strong>에 집중</p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">AI에게 일 잘 시키는 기술</p>
    <p style="font-size: 9pt; color: #6b6560;">17</p>
  </div>
</body>
</html>
