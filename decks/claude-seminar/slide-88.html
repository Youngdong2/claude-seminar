<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 9</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">관점 전환 한 문장</h2>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 18pt 26pt; margin-bottom: 14pt;">
    <p style="font-size: 14pt; color: #faf8f5; line-height: 1.55;"><strong style="color: #6b6560;">대체되는 사람</strong>이 아니라 —<br>내 경험과 취향이 처음으로 <strong style="color: #c45a3b;">자본이 되는 시대</strong>에 들어선 사람</p>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12pt;">
    <!-- Derived meaning -->
    <div style="background: #f0ebe3; border-radius: 6pt; padding: 12pt 16pt;">
      <p style="font-size: 9pt; color: #c45a3b; font-weight: 700; margin-bottom: 6pt;">이 관점에서 보면</p>
      <div style="display: flex; flex-direction: column; gap: 4pt;">
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.45;"><strong>CLAUDE.md</strong> = 내 취향을 자본화하는 한 줄</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.45;"><strong>Skill</strong> = 내 루틴을 자산으로 승격</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.45;"><strong>서브에이전트</strong> = 내 판단을 복제 가능하게</p>
        <p style="font-size: 9pt; color: #2d2a26; line-height: 1.45;"><strong>Plan-Critic</strong> = 내 리뷰 감각을 시스템에</p>
      </div>
    </div>

    <!-- Practical rule -->
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt;">
      <p style="font-size: 9pt; color: #c45a3b; font-weight: 700; margin-bottom: 6pt;">한 가지 실용 원칙</p>
      <p style="font-size: 10pt; color: #2d2a26; line-height: 1.5; font-style: italic; margin-bottom: 6pt;">"남의 요약본을 보고 또 요약하지 마라."</p>
      <p style="font-size: 9pt; color: #6b6560; line-height: 1.5;">직접 써보지 않은 기술 → <strong style="color: #2d2a26;">판단 유보</strong>. 남의 요약본 100개보다 내 손으로 한 번 써본 경험</p>
    </div>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">88</p>
  </div>
</body>
</html>
