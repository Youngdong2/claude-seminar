<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 28pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 1</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">숫자로 보는 변화</h2>
  </div>

  <!-- 숫자 카드 -->
  <div style="flex: 1; display: flex; gap: 16pt;">
    <div style="flex: 1; background: #f0ebe3; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 42pt; font-weight: 700; color: #c45a3b; line-height: 1;">25%</p>
      <p style="font-size: 11pt; color: #2d2a26; font-weight: 500; margin-top: 12pt;">YC 2025 겨울 배치 중<br>코드베이스의 <strong>95%를 AI로 생성</strong></p>
      <p style="font-size: 9pt; color: #6b6560; margin-top: 8pt;">Y Combinator</p>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 42pt; font-weight: 700; color: #c45a3b; line-height: 1;">~3개월</p>
      <p style="font-size: 11pt; color: #2d2a26; font-weight: 500; margin-top: 12pt;">Meta 엔지니어가 코드를<br><strong>직접 타이핑하지 않은 기간</strong></p>
    </div>
    <div style="flex: 1; background: #f0ebe3; border-radius: 8pt; padding: 24pt; display: flex; flex-direction: column; justify-content: center;">
      <p style="font-size: 42pt; font-weight: 700; color: #c45a3b; line-height: 1;">100%</p>
      <p style="font-size: 11pt; color: #2d2a26; font-weight: 500; margin-top: 12pt;">AI가 짠 코드가 사람의 터치 없이<br><strong>PR에 그대로 올라오는 일상</strong></p>
    </div>
  </div>

  <!-- 푸터 -->
  <div style="display: flex; justify-content: space-between; padding-top: 12pt;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">09</p>
  </div>
</body>
</html>
