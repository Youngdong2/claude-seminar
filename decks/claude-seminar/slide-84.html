<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt; height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #faf8f5;
      padding: 40pt 48pt;
      display: flex; flex-direction: column; position: relative;
    }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 12pt; margin-bottom: 14pt;">
    <p style="display: inline-block; padding: 3pt 9pt; background: #c45a3b; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">SECTION 8</p>
    <h2 style="font-size: 22pt; font-weight: 600; color: #2d2a26;">시작하는 사람에게 — 직업 무관 4가지</h2>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; margin-bottom: 14pt;">
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt; display: flex; gap: 12pt; align-items: flex-start;">
      <p style="font-size: 20pt; font-weight: 700; color: #c45a3b; line-height: 1; flex-shrink: 0;">1</p>
      <div>
        <p style="font-size: 11pt; color: #2d2a26; font-weight: 600; margin-bottom: 3pt;">자기 일에서 반복 발굴</p>
        <p style="font-size: 8.5pt; color: #6b6560; line-height: 1.5;">주 1회 이상 손으로 하는 일</p>
      </div>
    </div>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt; display: flex; gap: 12pt; align-items: flex-start;">
      <p style="font-size: 20pt; font-weight: 700; color: #c45a3b; line-height: 1; flex-shrink: 0;">2</p>
      <div>
        <p style="font-size: 11pt; color: #2d2a26; font-weight: 600; margin-bottom: 3pt;">글로 기록</p>
        <p style="font-size: 8.5pt; color: #6b6560; line-height: 1.5;">무엇 · 왜 · 어떻게 · 주의점</p>
      </div>
    </div>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt; display: flex; gap: 12pt; align-items: flex-start;">
      <p style="font-size: 20pt; font-weight: 700; color: #c45a3b; line-height: 1; flex-shrink: 0;">3</p>
      <div>
        <p style="font-size: 11pt; color: #2d2a26; font-weight: 600; margin-bottom: 3pt;">작게 시작하기</p>
        <p style="font-size: 8.5pt; color: #6b6560; line-height: 1.5;">완벽한 자동화가 아니라 "한 단계 덜 해도 되는 것"부터</p>
      </div>
    </div>
    <div style="background: #f0ebe3; border-left: 3pt solid #c45a3b; border-radius: 6pt; padding: 12pt 16pt; display: flex; gap: 12pt; align-items: flex-start;">
      <p style="font-size: 20pt; font-weight: 700; color: #c45a3b; line-height: 1; flex-shrink: 0;">4</p>
      <div>
        <p style="font-size: 11pt; color: #2d2a26; font-weight: 600; margin-bottom: 3pt;">결과 검증</p>
        <p style="font-size: 8.5pt; color: #6b6560; line-height: 1.5;">외부로 나가는 것은 반드시 사람이 확인</p>
      </div>
    </div>
  </div>

  <div style="background: #2d2a26; border-left: 3pt solid #c45a3b; border-radius: 8pt; padding: 14pt 22pt;">
    <p style="font-size: 12pt; color: #faf8f5; line-height: 1.5;">"컨텍스트를 설계하는 사람이 이긴다" — 개발자·비개발자 모두에게 <strong style="color: #c45a3b;">동일 적용</strong>.</p>
  </div>

  <div style="position: absolute; left: 48pt; right: 48pt; bottom: 24pt; display: flex; justify-content: space-between; align-items: center;">
    <p style="font-size: 9pt; color: #6b6560;">클로드코드 잘 사용하기</p>
    <p style="font-size: 9pt; color: #6b6560;">84</p>
  </div>
</body>
</html>
